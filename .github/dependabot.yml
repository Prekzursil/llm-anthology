version: 2

# `directory:` IS AN EXACT PATH, NOT A PREFIX. One rail per manifest tree, therefore --
# four manifests (pyproject.toml, js/package.json, cockpit/package.json,
# cockpit/src-tauri/Cargo.toml) need four rails plus the workflows. A manifest with no
# rail still produces alerts; it just cannot receive a fix.
# tests/test_dependency_rails.py walks the tree and fails when a manifest appears here
# without one.
#
# `labels:` are best-effort. Measured on PR #15: this file asks for
# ["dependencies", "github-actions"] and the PR carries `dependencies` alone, because no
# `github-actions` label exists on this repo. Prefer names that already exist or that
# Dependabot applies by default (`dependencies`, `javascript`, `rust`), and do not treat
# a label here as a guarantee.
updates:
  # Python rail
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      python-deps:
        patterns: ["*"]

  # JS/TypeScript rail
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      js-deps:
        # keep the security-relevant runtime deps ungrouped so they are reviewable
        # on their own; markdown-it is version-pinned for cross-rail byte parity
        # `dependency-type` is a direct group option -- nesting it under an extra
        # `dev-dependencies:` key is not schema-valid, so the filter never applied
        # and the group silently matched nothing.
        dependency-type: "development"

  # Cockpit front-end rail -- cockpit/package.json + cockpit/package-lock.json.
  #
  # Unreachable from the /js rail above: those are two independent trees with separate
  # lockfiles and `directory:` does not recurse. Until this entry existed the cockpit
  # lockfile had NO rail, so Dependabot could raise an alert against it and had no way
  # to propose the fix -- open alert #6 (postcss, cockpit/package-lock.json) sat exactly
  # there.
  #
  # And it is not a dev-only tree despite `"private": true`: release.yml's
  # `installer-build` job runs `npm ci` and `npx tauri build` from cockpit/, so these
  # packages execute while the installer that ships to users is being produced.
  - package-ecosystem: "npm"
    directory: "/cockpit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      cockpit-deps:
        # Same split as the /js rail, for the same reason: dev tooling arrives as one
        # PR while the runtime deps stay individually reviewable -- @tauri-apps/api is
        # the IPC surface, and elkjs (pinned 0.12.0) decides the graph layout the user
        # actually sees.
        dependency-type: "development"

  # Cockpit Rust rail -- cockpit/src-tauri/Cargo.toml + Cargo.lock.
  #
  # This is the code the desktop app IS, and it had no rail at all, which is the whole
  # reason open alert #7 (glib, cockpit/src-tauri/Cargo.lock) is unfixable by the bot.
  # ci.yml runs `cargo test --locked` and `cargo clippy --locked`, so the lockfile
  # Dependabot edits is the one both gates compile against.
  - package-ecosystem: "cargo"
    directory: "/cockpit/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      rust-deps:
        patterns: ["*"]

  # the workflows themselves
  #
  # FLEET RULE (2026-11-03): NO ignored updates -- not here, not anywhere in
  # this file. This rail previously ignored `dtolnay/rust-toolchain` whole,
  # because that action publishes a git BRANCH per Rust version AHEAD of the
  # release train (measured 2026-08-10: branches 1.98/1.99/1.100/1.100.0
  # existed while static.rust-lang.org 404'd those toolchains; Dependabot PR
  # #15 bumped 1.91.0 -> 1.100.0 and both cockpit legs died on "could not
  # download nonexistent rust version", run 31318613838).
  #
  # The fleet rule now takes the cost instead of the suppression: when the bot
  # proposes a phantom ref, that PR arrives RED and a human closes it until the
  # ref is installable. tests/test_dependency_rails.py enforces BOTH halves --
  # (a) every rail in this file ignores NOTHING, and (b) the workflows pin the
  # toolchain at an exact X.Y.Z that both copies agree on -- so a phantom bump
  # can only ever be a visible red PR, never a silent drift of main.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]
