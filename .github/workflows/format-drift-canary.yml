name: format-drift canary

# WHY THIS WORKFLOW EXISTS  (decision D-2)
#
# Four generators in this repo turn the PYTHON rails' real output into the committed inputs
# of the JS cross-language gates:
#
#   js/test/fixtures/gen-adapter-parity-synthetic.py -> adapter-parity-synthetic.json
#   tools/gen-render-parity.py                       -> render-parity.json
#   tools/gen-parity-fixture.py                      -> sanitize-parity.json
#   tools/gen-adapter-parity.py                      -> adapter-parity.json  (LOCAL, gitignored)
#
# Measured 2026-08-10 (`grep -rn "tools/gen-" .github/`): only the FIRST is regenerated by a
# workflow -- ci.yml's `js` job. The other three run NOWHERE, and that is two distinct holes:
#
#  1. A committed fixture records what Python produced AT GENERATION TIME, and the JS test
#     compares the JS rail against the FIXTURE. So a change to a Python renderer or sanitizer
#     that nobody mirrors leaves the JS suite matching a stale fixture and passing: the two
#     rails separate in silence. ci.yml closes that for adapter parity only.
#  2. `tools/gen-adapter-parity.py` is the instrument for the ONE drift class no offline gate
#     can reach -- PROVIDER format drift, which needs real exports. An adapter refactor can
#     break that script and nothing notices until the owner reaches for it, which is exactly
#     the moment they need it. Running it here weekly keeps the instrument from rotting.
#
# WHAT THIS JOB CANNOT DO, stated plainly. It does NOT detect provider-side format drift. A
# runner has no exports, and every input here is synthetic and frozen, so a change in what
# ChatGPT/Claude/Gemini emit is invisible to it. The motivating case -- an early-2026 ChatGPT
# export change that broke third-party parsers with no version marker in the file -- is the
# PREMISE this job was commissioned on and is UNVERIFIED here: nothing in this repository
# measures it, and a machine with no network cannot. It is quoted because it names the shape
# of the risk, not as a finding. Detecting that class still requires running
# `python tools/gen-adapter-parity.py` against FRESH real exports on a machine that has them,
# then reading the diff. This job's scope is OUR-side drift
# (fixture staleness, cross-rail divergence, toolchain-side serialisation change) plus the
# liveness of that instrument. RELEASING.md carries the human half of the drill.
#
# WHY WEEKLY AND NOT PER-PUSH. Two of the three checks below only move when something OUTSIDE
# a commit moves: the interpreter is floating (see the setup-python step), so a new CPython
# that serialises differently shows up here and cannot show up on ci.yml's pinned 3.13. A
# weekly cadence surfaces that before a release rather than during one.
#
# Scheduled workflows run only from the default branch, and GitHub disables them after 60
# days with no repository activity -- so a silent canary is not proof of no drift. Re-enable
# from the Actions tab, or run it by hand with `workflow_dispatch`.

on:
  schedule:
    # Mondays 06:17 UTC. Weekly rather than daily: the drift this catches accumulates on the
    # timescale of a dependency or a provider release, and a daily green trains people to
    # ignore the run. Deliberately off the top of the hour -- GitHub delays or drops
    # scheduled runs queued at :00.
    - cron: "17 6 * * 1"

  # A canary nobody can trigger cannot be verified after an edit, and a schedule-only
  # workflow is unreachable for a week.
  workflow_dispatch:

  # Path-filtered, so editing the canary or anything it watches validates it on the PR that
  # makes the change instead of a week later. No `push:` twin: ci.yml's `js` job already
  # covers the post-merge direction for adapter parity, and GitHub Actions does not support
  # YAML anchors, so a second copy of this list would be a hand-maintained duplicate.
  pull_request:
    paths:
      - ".github/workflows/format-drift-canary.yml"
      - "tools/gen-adapter-parity.py"
      - "tools/gen-render-parity.py"
      - "tools/gen-parity-fixture.py"
      - "js/test/fixtures/gen-adapter-parity-synthetic.py"
      - "js/test/fixtures/*.json"
      - "llm_anthology/adapters/**"
      - "llm_anthology/render_html.py"
      - "llm_anthology/render_md.py"
      - "llm_anthology/sanitize.py"

# Read-only. This job writes nothing, opens nothing and uploads nothing -- see the note on
# artifacts at the bottom.
permissions:
  contents: read

jobs:
  canary:
    name: parity fixtures regenerate to the same bytes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # FLOATING, and that is the point: ci.yml's `js` job pins "3.13", so a serialisation
      # change arriving with a NEW interpreter cannot turn it red. Here it can.
      #
      # If a diff below fires with no source change, that is the signal working: regenerate
      # on the pinned 3.13 to see whether the change is interpreter-side, then decide
      # deliberately (accept the new bytes, or pin harder). Do not "fix" it by pinning this
      # step -- that deletes the only detector for this class.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Pinned, unlike python: nothing here is produced by node, so a floating major would
      # only add red that is not drift.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `pip install`: every generator puts the repo root on sys.path itself and the whole
      # import chain is stdlib-only -- the same reasoning ci.yml's `js` job records.
      - name: install the js rail (it consumes the fixtures regenerated below)
        working-directory: js
        run: npm ci

      - name: regenerate every COMMITTED parity fixture from the python rails
        run: |
          python js/test/fixtures/gen-adapter-parity-synthetic.py
          python tools/gen-render-parity.py
          python tools/gen-parity-fixture.py

      # `git diff --exit-code` on an UNTRACKED path reports no diff and exits 0, so on its own
      # it degrades into a permanently green no-op the moment a fixture stops being committed
      # -- which is how the gate ci.yml had to repair actually died (.gitignore already
      # swallows the LOCAL fixture next to these three). `ls-files --error-unmatch` fails when
      # a path is not tracked, so the detector is checked before its verdict is believed.
      #
      # ONE diff naming all three, rather than three diffs: the first failing diff would
      # otherwise hide the others, and a drift that hit two rails at once is the interesting
      # case.
      - name: fail if any committed fixture is untracked or stale
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch js/test/fixtures/adapter-parity-synthetic.json
          git ls-files --error-unmatch js/test/fixtures/render-parity.json
          git ls-files --error-unmatch js/test/fixtures/sanitize-parity.json
          git diff --exit-code -- \
            js/test/fixtures/adapter-parity-synthetic.json \
            js/test/fixtures/render-parity.json \
            js/test/fixtures/sanitize-parity.json
          echo "SUCCESS:fixture-staleness all three regenerate to the committed bytes"

      # Regenerating proves the bytes still match. This proves they are still CONSUMABLE --
      # the fixtures feed the cross-language parity suites, and a fixture that is byte-stable
      # but no longer parseable by the rail that reads it is drift too.
      - name: the js rail still agrees with the freshly regenerated fixtures
        working-directory: js
        run: npm run test:fast

      # REFUSE BEFORE THE WRITE if this machine holds a real corpus. Found by dry-running
      # this job on the owner's machine: `tools/gen-adapter-parity.py` samples the corpus at
      # its hardcoded CORPUS path, and the run produced a 27,249,819-byte fixture holding 42
      # real Claude conversations. The synthetic-only assertion further down DID fire and
      # failed the step -- but only after that file existed. A hosted runner can never have
      # that path; a self-hosted one, or a human replaying these steps, can.
      #
      # The guard reads the path OUT OF THE TOOL rather than restating it, so it cannot drift
      # from what is actually sampled, and it fails closed if the constant moves.
      - name: refuse the provider-drift instrument on a machine holding a real corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import sys

          with open("tools/gen-adapter-parity.py", encoding="utf-8") as fh:
              src = fh.read()
          found = re.search(r'^CORPUS = r?"([^"]+)"', src, re.MULTILINE)
          if not found:
              sys.exit("FAILED:provider-drift-tool no CORPUS constant to guard on - the tool changed shape, so this guard is blind")
          if os.path.isdir(found.group(1)):
              sys.exit("FAILED:provider-drift-tool a real corpus is present and the tool SAMPLES it; run it by hand instead of unattended")
          print("SUCCESS:corpus-guard no corpus at the tool's CORPUS path, safe to run unattended")
          PY

      - name: the provider-drift instrument must still run (no other workflow runs it)
        shell: bash
        run: |
          set -euo pipefail
          python tools/gen-adapter-parity.py
          python - <<'PY'
          import json
          import sys

          PATH = "js/test/fixtures/adapter-parity.json"
          with open(PATH, encoding="utf-8") as fh:
              data = json.load(fh)
          counts = {k: len(v) for k, v in data.items()}
          names = [case["name"] for cases in data.values() for case in cases]
          if sorted(counts) != ["chatgpt", "claude", "gemini"] or not all(counts.values()):
              sys.exit("FAILED:provider-drift-tool empty or malformed output: %s" % (counts,))
          # The tool SAMPLES a real corpus when one is present. A runner has none, so every
          # case must be synthetic; a `real-` case here means private content reached CI.
          real = [n for n in names if n.startswith("real-")]
          if real:
              sys.exit("FAILED:provider-drift-tool %d real-corpus cases on a runner" % len(real))
          print("SUCCESS:provider-drift-tool %s, synthetic only" % (counts,))
          PY
          # Leave nothing behind. On a runner this file is synthetic (the guard above proved
          # no corpus is present), but an output that lingers is an output a later step or a
          # careless artifact upload can pick up. It is gitignored and regenerable.
          rm -f js/test/fixtures/adapter-parity.json

      # The privacy invariant, mechanised. The tool above writes a fixture that DOES embed
      # sampled real conversation content on a machine with a corpus. .gitignore blocks it,
      # but `git add -f` would defeat that silently and the file would ship in the repo.
      - name: the real-corpus fixture must never be tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch js/test/fixtures/adapter-parity.json 2>/dev/null; then
            echo "FAILED:privacy js/test/fixtures/adapter-parity.json is TRACKED, and it samples real conversation content"
            exit 1
          fi
          git check-ignore -v js/test/fixtures/adapter-parity.json
          echo "SUCCESS:privacy the real-corpus fixture is untracked and still ignored"

      # A scheduled job that can only ever be green is a no-op, and this repo has shipped
      # exactly that: adapter-parity.test.ts guarded its whole suite on a gitignored fixture
      # no workflow generated, so it skipped everywhere and vitest printed green. So the
      # canary proves its own fail-capability ON EVERY RUN rather than in a commit message.
      #
      # Mutate ONE IR value, then require BOTH detectors to report it -- the staleness diff
      # AND the suite that consumes the fixture. Then restore, and re-assert clean.
      #
      # Verified in an isolated clone at 22722aa before this file was committed, three states:
      #   clean            -> git diff exit 0, vitest 14 passed
      #   one IR mutated   -> git diff exit 1, vitest 1 failed / 13 passed
      #   control-for-the-control -> exit 1 on the first detector, with its message
      # The third was run as this step's shell logic with ONE line changed (the mutation
      # rewritten to assign the value back unchanged), not as the committed step verbatim --
      # the committed step cannot no-op on purpose. It is what proves the control is not
      # itself green-by-construction.
      - name: negative control - prove the drift gate can actually fail
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          PATH = "js/test/fixtures/adapter-parity-synthetic.json"
          with open(PATH, encoding="utf-8") as fh:
              data = json.load(fh)
          ir = data["claude"][0]["ir"]
          # Fail loudly rather than mutate nothing: a control that quietly no-ops would
          # report the gate as fail-capable while proving the opposite.
          if "title" not in ir:
              sys.exit("FAILED:negative-control no title key to mutate - the fixture shape moved")
          before = ir["title"]
          ir["title"] = "MUTANT-" + str(before)
          with open(PATH, "w", encoding="utf-8", newline="\n") as fh:
              json.dump(data, fh, ensure_ascii=True, indent=1, sort_keys=True)
              fh.write("\n")
          print("mutated claude[0].ir.title %r -> %r" % (before, ir["title"]))
          PY
          if git diff --quiet -- js/test/fixtures/adapter-parity-synthetic.json; then
            echo "FAILED:negative-control the staleness detector did NOT fire on a mutated fixture"
            exit 1
          fi
          if (cd js && npx vitest run test/adapter-parity.test.ts); then
            echo "FAILED:negative-control the parity suite PASSED against a mutated fixture"
            exit 1
          fi
          git checkout -- js/test/fixtures/adapter-parity-synthetic.json
          git diff --exit-code -- js/test/fixtures/adapter-parity-synthetic.json
          echo "SUCCESS:negative-control both detectors fired and the fixture is restored"

      # Deliberately NO upload-artifact. The only interesting output is the LOCAL fixture,
      # which is the one file in this repo that can carry real conversation content -- on a
      # runner it is synthetic, but an artifact step here would be a standing invitation to
      # run the same job somewhere that has a corpus.
      - name: terminal marker
        run: echo "SUCCESS:format-drift-canary fixtures byte-stable, instrument live, gate proven fail-capable"
