name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }} py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # a Windows-only green run can hide a Linux/CI gap, so test both,
          # and pin the oldest + newest supported interpreter
          #
          # `covgate` is the --cov-fail-under for that leg. 3.9 runs the FULL suite (all
          # 1280 tests must pass there; it is a supported target per requires-python) but
          # does not gate on the branch PERCENTAGE, because 3.9 mis-traces one code shape:
          # `if cond: body` immediately followed by `continue`. On 3.9 a false condition
          # jumps straight to the loop header, so the arc into the `continue` line is
          # reported as a partial branch even when a test provably drives both outcomes.
          # Controlled directly: an identical 9-line function with a test asserting both
          # paths ran reports 12->14 partial / 93% on 3.9 and 100% on 3.13. Four such arcs
          # exist in codex_rollout.py and discover.py; all four are covered on 3.13.
          # Enforcing the percentage where the measurement is trustworthy keeps the gate
          # honest instead of contorting production code around an EOL interpreter's
          # tracing. Coverage is still gated at 100% on three OSes.
          - { os: ubuntu-latest, python: "3.9", covgate: "0" }
          - { os: ubuntu-latest, python: "3.13", covgate: "100" }
          - { os: windows-latest, python: "3.13", covgate: "100" }
          - { os: macos-latest, python: "3.13", covgate: "100" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # pytest config enforces --cov-fail-under=100 (branch coverage) on llm_anthology/;
      # the explicit flag overrides it per matrix leg (see covgate above).
      - run: python -m pytest --cov-fail-under=${{ matrix.covgate }}

  js:
    name: js tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The adapter cross-language parity fixture is produced by the PYTHON adapters, so
      # this job needs an interpreter. No `pip install`: the generator puts the repo root on
      # sys.path itself and the whole import chain (llm_anthology.ir, .corpus, the three
      # adapters) is stdlib-only -- verified by reading their imports, sqlite3/dataclasses/
      # typing being the only ones.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: npm ci
      - run: npm run typecheck

      # WHY THIS STEP EXISTS.
      #
      # test/adapter-parity.test.ts is the only gate that reaches the hard adapter logic
      # (Claude's subtree-max active-path walk, ChatGPT's current_node fallback and branch
      # bookkeeping, the content-type dispatch). Until now it was one
      # describe.skipIf(!present) over test/fixtures/adapter-parity.json -- a file that is
      # gitignored (.gitignore:32) and generated by NO workflow. So it skipped in every CI
      # run and every fresh clone, and vitest reported that as green. Measured against a
      # deliberately broken ChatGPT adapter in an isolated copy, the old file printed
      # "1 passed | 1 skipped" -- the one pass being `expect(typeof present).toBe("boolean")`,
      # a tautology. The new file's committed fixture caught the same mutant (1 failed).
      #
      # The committed fixture makes the gate real on its own; regenerating it HERE closes the
      # other direction. The fixture encodes what the PYTHON adapters currently produce, so if
      # a python adapter changes and this rail is not updated to match, the diff below turns
      # the js job red at the source of the drift instead of letting the two rails separate
      # silently. Byte-stability is not assumed: the generator writes with newline="\n",
      # sort_keys and ensure_ascii, and every timestamp is anchored with tz=timezone.utc
      # (chatgpt.py:75), which was confirmed by regenerating under TZ=Asia/Tokyo and getting
      # an identical md5.
      - name: regenerate the committed adapter-parity fixture from the python adapters
        run: python test/fixtures/gen-adapter-parity-synthetic.py

      # `git diff --exit-code` on an UNTRACKED path reports no diff and exits 0, so on its
      # own it would silently degrade to a no-op the moment the fixture stopped being
      # committed -- which is exactly how the gate it replaces died (.gitignore:32 already
      # swallows its sibling adapter-parity.json). ls-files --error-unmatch fails when the
      # path is not tracked, so the detector is checked before its verdict is trusted.
      - name: fail if the committed fixture is untracked or stale (python/js adapter drift)
        run: |
          git ls-files --error-unmatch test/fixtures/adapter-parity-synthetic.json
          git diff --exit-code -- test/fixtures/adapter-parity-synthetic.json

      # enforces 100% statements/lines/functions + the branch floor
      - run: npm test
      - run: npm run build

  js-package:
    name: packaged npm artifact smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      # a green source tree does not prove the PACKED artifact works: pack, install
      # the tarball into a throwaway project, drive the installed binary
      - name: pack, install and drive the installed CLI
        run: |
          TGZ=$(npm pack --silent)
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null
          npm install "$OLDPWD/$TGZ"
          npx llm-anthology demo /tmp/demo.html
      - name: postcondition - the demo page exists and is real HTML
        run: |
          test -s /tmp/demo.html
          head -c 15 /tmp/demo.html | grep -qi '<!doctype html'

  package:
    name: packaged-artifact smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build

      # A green source tree does not prove the BUILT artifact works. Install the
      # wheel into a clean venv, drive the installed console script, and assert a
      # real postcondition on what it produced.
      - name: install the wheel into a clean venv and run the CLI
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "from llm_anthology.adapters import chatgpt, claude, gemini; from llm_anthology import cli, build, loaders; print('imports ok')"
          /tmp/venv/bin/llm-anthology demo /tmp/demo.html
      - name: postcondition - the demo page exists and is real HTML
        run: |
          test -s /tmp/demo.html
          head -c 15 /tmp/demo.html | grep -qi '<!doctype html'
          echo "OK: $(wc -c < /tmp/demo.html) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  cockpit:
    # WHY THIS JOB EXISTS.
    #
    # Before it, this file had exactly two test jobs: `test` (python -m pytest)
    # and `js` (working-directory: js -- the SEPARATE TypeScript port). Neither
    # ever entered cockpit/ or cockpit/src-tauri/. So 365 vitest tests, 18 cargo
    # tests, the cockpit typecheck and the Tauri build had never run in CI even
    # once, on any platform. A suite nothing executes is indistinguishable from
    # no suite at all, and that gap is where an entire class of shipped bug
    # lived: `main` was read as green while no gate had ever so much as compiled
    # the code the release actually ships.
    #
    # Both platforms, because a Windows-only green run is the exact shape that
    # hides a Linux gap -- sidecar.rs carries 12 cfg(windows)/cfg(not(windows))
    # gates whose non-Windows arms no CI and no local run had ever compiled.
    #
    # Deliberately BLOCKING on both legs. A gate permitted to fail is not a gate,
    # and continue-on-error produces the red-X-on-a-green-run state that trains
    # reviewers to discount the whole check surface. fail-fast: false already
    # buys the real benefit: a red linux leg does not cancel the windows one.
    name: cockpit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cockpit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Tauri v2 links against webkit2gtk 4.1. The 4.0 packages are the Tauri v1
      # ABI, not a fallback -- on ubuntu-24.04 (what ubuntu-latest resolves to
      # today) they are not in the archive at all.
      - name: install the GTK/WebKit toolchain Tauri v2 links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cockpit/package-lock.json

      # THE ENGINE IS A TEST DEPENDENCY OF THIS JOB, and it took a red CI to see it.
      #
      # Five cargo tests here spawn a REAL Python sidecar as a subprocess --
      # e2e_roundtrip_real_python_sidecar, e2e_create_without_an_index...,
      # e2e_discover_sources_without_an_index, e2e_timetravel_export_roundtrip...,
      # and the AppContainer membrane test. This job installed node and rust and
      # never installed the Python package they spawn, so they ran against
      # whatever bare interpreter the runner ships.
      #
      # That was survivable only while the engine was pure stdlib. It stopped
      # being true this batch: 07be166 put a top-level `import ijson` on the
      # ingest path and 0fc4463 added `from . import archive`, whose archive.py
      # imports zstandard. All five then died with ModuleNotFoundError on BOTH
      # legs -- while every local run stayed green, because a developer machine
      # has those wheels installed globally and CI does not.
      #
      # So the gap is older than the failure: those five tests have never once
      # validated the engine's real dependency surface. Installing the package
      # is what makes them mean what their names claim.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install the engine the e2e sidecar tests spawn
        working-directory: ${{ github.workspace }}
        run: pip install -e .

      # Pinned rather than @stable: `clippy -D warnings` would turn every
      # unrelated PR red the day a new Rust release adds a lint. 1.91.0 is the
      # toolchain this code is developed against.
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy

      # The one deliberate deviation from this file's no-caching convention: a
      # cold Rust/Tauri build is 10-20 min per leg, which the pip and npm installs
      # above are not. cache-on-failure keeps a red lint run from re-paying that
      # cost on every fix iteration.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cockpit/src-tauri -> target
          shared-key: cockpit
          cache-on-failure: true

      - run: npm ci
      # cockpit/package.json has no `typecheck` script (js/package.json does), so
      # this is npx tsc directly rather than the `npm run typecheck` used above.
      - run: npx tsc --noEmit
      - run: npm test
      # `tsc && vite build`. Also produces the ../dist that tauri.conf.json points
      # frontendDist at, which the cargo steps below need to already exist.
      - run: npm run build

      # MUST precede every cargo AND tauri invocation, `cargo test` included.
      # tauri.conf.json declares bundle.resources {"resources/engine": "engine"}
      # and tauri-build's build.rs resolves that at COMPILE time -- a missing
      # directory is a hard ResourcePathNotFound, not a warning. The directory is
      # gitignored (.gitignore:46 -- a ~35MB staged interpreter), so a clean
      # checkout has nothing there. An EMPTY directory is explicitly tolerated.
      - name: materialise the gitignored engine resource directory
        shell: bash
        run: mkdir -p src-tauri/resources/engine

      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: tauri build (nsis bundle)
        if: runner.os == 'Windows'
        run: npx tauri build

      # bundle.targets is ["nsis"], which is Windows-only, and the vendored engine
      # is a Windows CPython staged by a PowerShell-only script -- so a Linux
      # bundle would be untrue regardless. --no-bundle scopes this leg to the
      # compile + link, which is the part that genuinely has never run.
      - name: tauri build (compile and link only)
        if: runner.os == 'Linux'
        run: npx tauri build --no-bundle

      # Deliberately NO upload-artifact, unlike the `package` and `js-package`
      # jobs above: the engine directory staged here is EMPTY, so the installer
      # this produces is a compile receipt, not a shippable build. Uploading it
      # would hand out an artifact no smoke test has validated.
