<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>llm_anthology cockpit</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header id="topbar">
        <h1>llm_anthology cockpit</h1>
        <!-- The corpus control sits FIRST after the title because attaching a corpus is
             both the app's primary action and the precondition for every other pane:
             the engine answers nothing until it succeeds. role="group" (not a landmark)
             matches the sidebar's wrapper convention — it names a related set of
             controls without imposing a child-role contract. -->
        <div id="corpus-bar" role="group" aria-label="Corpus">
          <button id="btn-open-corpus" type="button">Open corpus…</button>
          <!-- role="status" (polite): the picker is a NATIVE dialog, so when it closes
               there is no in-page focus change to tell a screen-reader user which corpus
               they just attached. The text here is a placeholder — CorpusBar repaints it
               from NO_CORPUS_LABEL on construction. -->
          <span id="corpus-current" class="muted" role="status">No corpus open</span>
          <!-- Empty until something fails. role="alert" so a failure the user caused by
               pressing the button is announced, not silently painted. -->
          <span id="corpus-error" class="corpus-error" role="alert"></span>
        </div>
        <span id="stats" class="muted"></span>
        <span class="spacer"></span>
        <span id="health" class="muted"></span>
      </header>

      <aside id="sidebar" aria-label="Threads, search and export">
        <h2 class="panel-title" id="threads-title">Threads</h2>
        <!-- role="group", NOT role="list": these viewports are virtualized and render
             <button class="root-row"> children, not <li>/role=listitem. Declaring a
             list here produced a CRITICAL aria-required-children violation (measured:
             it replaced the moderate landmark one). role=group is the correct wrapper
             for a labelled set of controls and imposes no child-role contract. -->
        <div id="roots-list" class="list-viewport" role="group" aria-labelledby="threads-title"></div>

        <h2 class="panel-title" id="search-title">Search</h2>
        <label class="visually-hidden" for="search-input">Search conversations</label>
        <input id="search-input" type="search" placeholder="Search conversations…" autocomplete="off" />
        <label class="visually-hidden" for="search-provider">Filter by provider</label>
        <!-- Populated from corpus.stats and hidden for a single-provider corpus, so it is
             absent rather than useless when there is nothing to narrow. -->
        <select id="search-provider" class="search-filter" hidden></select>
        <div id="search-status" class="muted" role="status" aria-live="polite"></div>
        <div id="search-results" class="list-viewport" role="group" aria-labelledby="search-title"></div>

        <h2 class="panel-title" id="export-title">Export</h2>
        <div id="export-panel" aria-labelledby="export-title"></div>
      </aside>

      <main id="graph-pane" aria-label="Spawn tree">
        <div id="graph-toolbar" role="toolbar" aria-label="Graph view controls">
          <button id="btn-forest" type="button">Full forest</button>
          <button id="btn-fit" type="button">Fit</button>
          <button id="btn-aggregate" type="button" aria-pressed="false">Aggregated</button>
          <button id="btn-diff" type="button" aria-pressed="false">Diff mode</button>
          <span id="graph-status" class="muted" role="status" aria-live="polite"></span>
          <span class="spacer"></span>
          <span id="legend"></span>
        </div>
        <div id="scrubber"></div>
        <!-- AUTO-DISCOVERY, the first-run surface. It lives in the graph pane because
             that pane is the large empty rectangle on a fresh install and this is the
             widest column — 25 near-identical export paths do not fit a 300px sidebar.
             Left EMPTY by DiscoveryPanel whenever there is nothing to show, so the
             `#discovery:empty` rule collapses it and an attached corpus gets the whole
             pane back with no toggle to find. Same mechanism as `#scrubber:empty`.
             role/aria-labelledby are set by the panel when it paints, because an empty
             labelled group would otherwise sit in the a11y tree announcing nothing. -->
        <div id="discovery"></div>
        <!-- The canvas is a rendering of the thread graph that the Threads list and
             the detail pane already expose as real DOM; it is labelled so a screen
             reader announces its purpose rather than an unnamed graphic. -->
        <canvas id="tree-canvas" role="img" aria-label="Spawn-tree graph of conversation threads"></canvas>
      </main>

      <!-- A <section> is only exposed as a landmark when it has an accessible name.
           Without one, its content counted as "not contained by landmarks" — the
           single moderate axe violation in the first audit. -->
      <section id="detail" aria-label="Thread details">
        <p class="muted">Select a node to inspect a thread.</p>
      </section>
    </div>
  </body>
</html>
