[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-anthology"
version = "0.1.0"
description = "A local, private anthology of every AI coding session — browse, search, spawn-tree, faithfully export and safely manage ChatGPT / Claude / Gemini / Codex history. No network, no egress."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prekzursil" }]
keywords = [
    "chatgpt", "claude", "gemini", "codex", "export", "transcript", "conversation",
    "markdown", "html", "offline", "privacy", "archive", "anthology",
    "session-manager", "agent-sessions", "spawn-tree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
# zstandard is REQUIRED, not optional: a live Codex store compresses its rollouts, and a
# measured store held 2043 `rollout-*.jsonl.zst` against ZERO plain `.jsonl`. Without this
# the bundled engine reads that user's entire history as zero conversations — and reports
# zero errors doing it. `archive.py` already depended on it while it was undeclared.
#
# markdown-it-py is capped BELOW 5, not below 4. It renders the HTML this product exists
# to show, there is no lockfile on the Python rail, and no test asserts an exact rendered
# string — so an unbounded major arrives on the next clean install and rewrites
# user-facing output with the suite still green. `<5` is the ceiling that changes nothing
# today and blocks the next unreviewed major: measured 2026-08-10, PyPI's latest is 4.2.0
# and 4.x requires Python >=3.10, so the 3.13 legs already resolve 4.x while the 3.9 leg
# resolves 3.0.0 — both lines are green in CI right now. `<4` would instead DOWNGRADE
# three of the four legs and break cross-rail parity: markdown-it-py 4.0.0's release
# notes put it at upstream Markdown-It v14.1.0, which is the line js/package.json pins
# at 14.3.0, while 3.x ports the 13.x line.
#
# ijson is REQUIRED for the same class of reason zstandard is: without it a real user's
# real export is unusable. DECISION G-7 — the export ingest streams the TOP-LEVEL ARRAY of
# a conversations.json instead of `json.load`-ing it, because a whole-file load was
# measured at x3.69 memory amplification and the owner's own ChatGPT export is ~728 MB,
# i.e. ~2.7 GB of peak heap for one import on a laptop. Streaming makes peak memory
# conversation-sized. Adding a third dependency to a two-dependency project was a
# deliberate, approved trade against writing an incremental JSON parser by hand.
#
# Capped BELOW 4 as cheap insurance, but the reason is NOT markdown-it-py's: ijson's
# surface here is `items(fh, "item")` and `basic_parse(fh)`, so a major that moved either
# would raise on the first call and go red in CI — a LOUD failure, not the silent
# user-facing output change an unbounded renderer major produces. That is also why it is
# deliberately NOT added to `MUST_BE_CAPPED` in tests/test_dependency_rails.py: that gate
# is scoped to dependencies whose output IS the rendered product and whose drift is
# invisible. The floor is 3.1 — `items`/`basic_parse` predate it — and 3.4+ declares
# `requires-python >=3.9`, which matches this project's floor, with cp39 wheels published
# for every CI leg (manylinux x86_64, macOS, Windows), so no leg has to compile it.
dependencies = ["markdown-it-py>=2.2,<5", "zstandard>=0.22", "ijson>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/Prekzursil/ai-sessions-render"
Source = "https://github.com/Prekzursil/ai-sessions-render"
Issues = "https://github.com/Prekzursil/ai-sessions-render/issues"

[project.scripts]
llm-anthology = "llm_anthology.cli:main"
anth = "llm_anthology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_anthology"]

[tool.hatch.build.targets.sdist]
include = [
    "/llm_anthology",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/ARCHITECTURE.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Lean 100% coverage gate — every statement in llm_anthology/ must be exercised; the few
# genuinely-unreachable defensive guards carry a justified `# pragma: no cover`.
addopts = "-q --cov=llm_anthology --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["llm_anthology"]
