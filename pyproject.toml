[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-anthology"
version = "0.1.0"
description = "A local, private anthology of every AI coding session — browse, search, spawn-tree, faithfully export and safely manage ChatGPT / Claude / Gemini / Codex history. No network, no egress."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prekzursil" }]
keywords = [
    "chatgpt", "claude", "gemini", "codex", "export", "transcript", "conversation",
    "markdown", "html", "offline", "privacy", "archive", "anthology",
    "session-manager", "agent-sessions", "spawn-tree",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
# zstandard is REQUIRED, not optional: a live Codex store compresses its rollouts, and a
# measured store held 2043 `rollout-*.jsonl.zst` against ZERO plain `.jsonl`. Without this
# the bundled engine reads that user's entire history as zero conversations — and reports
# zero errors doing it. `archive.py` already depended on it while it was undeclared.
dependencies = ["markdown-it-py>=2.2", "zstandard>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/Prekzursil/LLM_Anthology"
Source = "https://github.com/Prekzursil/LLM_Anthology"
Issues = "https://github.com/Prekzursil/LLM_Anthology/issues"

[project.scripts]
llm-anthology = "llm_anthology.cli:main"
anth = "llm_anthology.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_anthology"]

[tool.hatch.build.targets.sdist]
include = [
    "/llm_anthology",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/ARCHITECTURE.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Lean 100% coverage gate — every statement in llm_anthology/ must be exercised; the few
# genuinely-unreachable defensive guards carry a justified `# pragma: no cover`.
addopts = "-q --cov=llm_anthology --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["llm_anthology"]
